version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - typo

# Homebrew Cask
homebrew_casks:
  - name: jsawn
    binaries:
      - jsawn
    repository:
      owner: aryankumar07
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    url:
      verified: github.com/aryankumar07/jsawn
    homepage: "https://github.com/aryankumar07/jsawn"
    description: "Interactive JSON viewer for the terminal"

# GitHub Release
release:
  github:
    owner: aryankumar07
    name: jsawn
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## Release {{ .Tag }} ({{ .Date }})

    Fast JSON parsing with jsawn!
  footer: |
    ## Installation

    ### Homebrew (macOS/Linux)
    ```bash
    brew tap aryankumar07/tap
    brew install jsawn
    ```

    ### Manual Installation
    Download the appropriate archive for your platform from the assets below.
